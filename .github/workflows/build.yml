name: Build Windows EXE

on:
  push:
    branches:
      - main   # runs automatically on every commit to main branch

permissions:
  contents: write   # ✅ REQUIRED for creating GitHub releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --clean --noconfirm --name Pending_Mygate_Tickets_Report Pending_Mygate_Tickets_Report.py

      - name: Create GitHub Release & Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Auto Release v${{ github.run_number }}
          files: dist/Pending_Mygate_Tickets_Report.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
