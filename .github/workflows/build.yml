name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile Pending_Mygate_Tickets_Report.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Pending_Mygate_Tickets_Report
          path: dist/Pending_Mygate_Tickets_Report.exe
